name = "power"
name_pretty = "Power Menu"
icon = "system-shutdown"

[[entries]]
text = "All Options"
[entries.actions]
"hibernate" = "hyprlock & sleep 2; systemctl hibernate"
"lock" = "hyprlock"
"poweroff" = "hyprshutdown --post-cmd poweroff --top-label 'Shutting down'"
"reboot" = "hyprshutdown --post-cmd reboot --top-label 'Rebooting'"
"suspend" = "hyprlock & sleep 2; systemctl suspend"

[[entries]]
text = "Log Off"
keywords = ["log off", "logoff", "exit"]
actions = { "logoff" = "hyprshutdown" }
icon = "action-exit"

[[entries]]
text = "Sleep"
keywords = ["sleep", "suspend"]
actions = { "suspend" = "hyprlock & sleep 2; systemctl suspend" }
icon = "preferences-desktop-screensaver"

[[entries]]
text = "Power Off"
keywords = ["poweroff", "shutdown"]
actions = { "poweroff" = "hyprshutdown --post-cmd poweroff --top-label 'Shutting down'" }
icon = "media-playback-stop"

[[entries]]
text = "Reboot"
keywords = ["restart"]
actions = { "reboot" = "hyprshutdown --post-cmd reboot --top-label 'Rebooting'" }
icon = "system-reboot"

[[entries]]
text = "Hibernate"
actions = { "hibernate" = "hyprlock & sleep 2; systemctl hibernate" }
icon = "media-playback-pause"

[[entries]]
text = "Lock"
actions = { "lock" = "hyprlock" }
icon = "system-lock-screen"