# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    path = screenshot
    blur_passes = 3
}

input-field {
    size = 380, 50
    outline_thickness = 3
    rounding = -1
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    font_color = rgb(206, 206, 206)
    dots_spacing = 0.3

    font_family = DM Mono
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    position = 0, -165
}

# hour
label {
    text = cmd[update:1000] date +"%I"
    color = rgb(5, 149, 245)
    font_size = 150
    font_family = Nunito Heavy
    position = -50, 100
    shadow_passes = 1
}

# minute
label {
    text = cmd[update:1000] date +"%M"
    color = rgb(255, 51, 0)
    font_size = 150
    font_family = Nunito Heavy
    position = 50, 0
    shadow_passes = 1
}

# am/pm
label {
    text = cmd[update:1000] date +"%P"
    color = rgb(223, 223, 223)
    font_size = 30
    font_family = Nunito Heavy
    position = 150, 80
    shadow_passes = 1
}

# date
label {
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgb(223, 223, 223)
    font_size = 30
    font_family = Nunito Heavy
    position = 0, -100
    shadow_passes = 1
}